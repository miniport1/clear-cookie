name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm test

      - name: Build & Pack Chrome and Firefox
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

          npm run pack
          cp dist/clear-cookie-chrome.zip "dist/clear-cookie-chrome-${TAG}.zip"
          cp dist/clear-cookie-firefox.zip "dist/clear-cookie-firefox-${TAG}.zip"
          (cd dist && sha256sum "clear-cookie-chrome-${TAG}.zip" "clear-cookie-firefox-${TAG}.zip" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "dist/clear-cookie-chrome-${RELEASE_TAG}.zip" \
            "dist/clear-cookie-firefox-${RELEASE_TAG}.zip" \
            "dist/SHA256SUMS.txt" \
            --title "ClearCookie ${RELEASE_TAG}" \
            --notes "## 特性
          - 零运行时依赖，Manifest 强制 \`connect-src 'none'\`（物理禁止外联）
          - 按需站点授权（\`optional_host_permissions\`），支持在设置页一键收回
          - 支持工具栏 Popup、侧边栏（Chrome Side Panel / Firefox Sidebar）与 DevTools 面板
          - 完整 Cookie 增删改查，兼容 Firefox 多账号容器（\`cookieStoreId\`）与 CHIPS 分区 Cookie（\`partitionKey\`）
          - JSON / Header String / Netscape (\`cookies.txt\`) 导入与导出（导入自动识别格式）
          - 自动解码预览 JWT（含过期状态）、JSON、URL 编码与 Base64
          - 本地站点快照（Profiles）与一键防录屏遮罩

          ## 安装说明
          - **Chrome / Edge / Brave / Arc**：下载 \`clear-cookie-chrome-${RELEASE_TAG}.zip\` 并解压，打开 \`chrome://extensions\` 开启「开发者模式」→「加载已解压的扩展程序」选择解压目录。
          - **Firefox (≥ 128)**：下载 \`clear-cookie-firefox-${RELEASE_TAG}.zip\` 并解压，打开 \`about:debugging#/runtime/this-firefox\` →「临时载入附加组件」选择 \`manifest.json\`（长期使用建议提交到 Mozilla 账号进行仅自用签名）。"
